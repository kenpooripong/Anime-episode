<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Anime-episode — Aggregator</title>
    <meta name="description" content="Anime-episode: quick links to official streaming for episodes, arcs and highlight scenes." />
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-900 text-gray-100 antialiased">
    <div class="min-h-screen flex flex-col">
      <header class="sticky top-0 z-20">
        <div class="backdrop-blur-md bg-gradient-to-b from-gray-900/60 to-gray-900/40 border-b border-gray-800/60">
          <div class="max-w-6xl mx-auto px-4 py-4 flex items-center gap-6">
            <div class="flex items-center gap-3">
              <h1 class="text-2xl font-extrabold tracking-tight">Anime-episode</h1>
              <span class="text-sm text-gray-400 hidden sm:inline">Premium links to scenes & arcs</span>
            </div>

            <div class="flex-1">
              <label class="relative block">
                <svg class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 w-5 h-5 pointer-events-none" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden>
                  <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35M11 19a8 8 0 100-16 8 8 0 000 16z"></path>
                </svg>
                <input id="searchInput" type="search" placeholder="Search anime, titles, or alt names" class="w-full pl-11 pr-4 py-2 rounded-full bg-gray-800/60 border border-gray-700 text-gray-100 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-500 transition" />
              </label>
            </div>

            <nav class="flex items-center gap-3">
              <button class="hidden sm:inline px-3 py-1 rounded hover:bg-gray-800/60 text-sm text-gray-300">Explore</button>
              <button class="px-3 py-1 rounded bg-blue-600 hover:bg-blue-500 text-sm">Sign in</button>
            </nav>
          </div>
        </div>
      </header>

      <style>
        /* fallback line-clamp if Tailwind plugin not enabled */
        .line-clamp-3 { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
        .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
      </style>

      <main class="flex-1 max-w-6xl mx-auto px-4 py-6">
        <div id="listView">
          <h2 class="text-xl font-semibold mb-4">Results</h2>
          <div id="results" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
        </div>

        <div id="detailView" class="hidden">
          <button id="backBtn" class="mb-4 text-sm text-blue-400">← Back</button>
          <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="col-span-1">
              <img id="coverImage" src="" alt="cover" class="w-full rounded shadow-lg"/>
            </div>
            <div class="lg:col-span-2">
              <h2 id="animeTitle" class="text-2xl font-bold"></h2>
              <p id="synopsis" class="mt-2 text-gray-300"></p>
              <div id="tags" class="mt-3 flex gap-2 flex-wrap"></div>
              <div class="mt-4">
                <a id="startWatching" class="inline-block bg-blue-600 hover:bg-blue-500 px-4 py-2 rounded">Start Watching (Episode 1)</a>
              </div>

              <section class="mt-8">
                <h3 class="text-xl font-semibold mb-3">Story Arcs & Highlight Scenes</h3>
                <div id="scenesGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
              </section>
            </div>
          </div>
        </div>
      </main>

      <footer class="text-center text-gray-400 text-sm py-6">
        Built as a mockup — links are examples. Mobile-first, dark-friendly.
      </footer>
    </div>

    <script type="module" src="src/app.js"></script>
  </body>
</html>
